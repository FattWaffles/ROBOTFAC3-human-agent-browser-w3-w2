<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="public/icon.png" />
    <title>RobotFac3</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <nav class="site-nav" aria-label="Site">
        <a class="site-brand" href="/"><img src="public/logo.png" alt="" class="site-logo" />RobotFac3<span class="chip chip-muted">web preview</span></a>
        <div class="site-links">
          <button type="button" class="site-link" data-nav="rf3://search">Search</button>
          <a href="https://github.com/FattWaffles/ROBOTFAC3-human-agent-browser-w3-w2" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="mailto:hello@robotfac3.com" title="Email the team">Contact</a>
          <a id="downloadBtn" class="btn btn-red btn-small" href="https://github.com/FattWaffles/ROBOTFAC3-human-agent-browser-w3-w2/releases/latest" target="_blank" rel="noopener noreferrer"
            title="Desktop builds will be posted on the GitHub releases page">Download desktop app</a>
          <span class="chip chip-warn" title="No desktop build exists yet">soon</span>
        </div>
      </nav>
      <header class="chrome">
        <div class="chrome-top">
          <img src="public/logo.png" alt="RobotFac3" class="logo" />
          <div class="mode-switch">
            <button data-mode="human" class="mode-btn">You</button>
            <button data-mode="agent" class="mode-btn">Agent</button>
          </div>
          <div class="chrome-actions">
            <span id="upstream" class="chip chip-muted" title="Where the relay sends Solana requests">rpc: …</span>
            <button id="settingsBtn" class="btn btn-ghost">Settings</button>
            <button id="walletBtn" class="btn btn-red">Connect Phantom</button>
          </div>
        </div>
        <form id="addressForm" class="address-row">
          <button type="button" id="homeBtn" class="btn btn-ghost btn-icon" title="Home">⌂</button>
          <div class="address-box">
            <span id="protoBadge" class="chip chip-muted">—</span>
            <input id="address" autocomplete="off" autocapitalize="off" spellcheck="false"
              placeholder="toly.sns · solana.com · or search Web3 projects on any chain" />
            <span class="chip chip-ok">shield on</span>
          </div>
          <button class="btn btn-red">Go</button>
        </form>
      </header>

      <div class="body">
        <main id="view" class="view"></main>
        <aside class="sidebar">
          <div class="sidebar-head">
            <h2>Security core</h2>
            <span class="chip chip-red">live</span>
          </div>
          <div id="log" class="log"></div>
        </aside>
      </div>
    </div>

    <div id="modal" class="modal" hidden></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
